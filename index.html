<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly3D - Cristallochimie L2</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      AFRAME.registerComponent('swipe-rotate', {
        schema: { speed: {default: 1.5} },
        init: function () {
          this.isDragging = false;
          this.previousPosition = { x: 0, y: 0 };
          
          this.onDragStart = this.onDragStart.bind(this);
          this.onDragMove = this.onDragMove.bind(this);
          this.onDragEnd = this.onDragEnd.bind(this);

          // Écoute des gestes sur l'écran tactile
          document.addEventListener('touchstart', this.onDragStart);
          document.addEventListener('touchmove', this.onDragMove);
          document.addEventListener('touchend', this.onDragEnd);
          
          // Écoute de la souris (pour que tu puisses tester sur ton Mac !)
          document.addEventListener('mousedown', this.onDragStart);
          document.addEventListener('mousemove', this.onDragMove);
          document.addEventListener('mouseup', this.onDragEnd);
        },
        
        onDragStart: function (event) {
          this.isDragging = true;
          let clientX = event.touches ? event.touches[0].clientX : event.clientX;
          let clientY = event.touches ? event.touches[0].clientY : event.clientY;
          this.previousPosition = { x: clientX, y: clientY };
        },

        onDragMove: function (event) {
          if (!this.isDragging) return;
          
          let clientX = event.touches ? event.touches[0].clientX : event.clientX;
          let clientY = event.touches ? event.touches[0].clientY : event.clientY;
          
          let deltaX = clientX - this.previousPosition.x;
          let deltaY = clientY - this.previousPosition.y;
          
          // Applique la rotation sur les axes X et Y
          this.el.object3D.rotation.y += deltaX * (this.data.speed / 100);
          this.el.object3D.rotation.x += deltaY * (this.data.speed / 100);
          
          this.previousPosition = { x: clientX, y: clientY };
        },

        onDragEnd: function () {
          this.isDragging = false;
        }
      });
    </script>

    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; 
                           autoStart: true; 
                           warmUpTolerance: 5; 
                           missTolerance: 100; 
                           filterMinCF: 0.00001; 
                           filterBeta: 0.005;" 
             color-space="sRGB" 
             renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.2;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
        <a-assets>
            <a-asset-item id="cristal" src="./ccnontangent.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity light="type: ambient; intensity: 0.4;"></a-entity>
        <a-entity light="type: directional; intensity: 1.2; position: 1 4 3"></a-entity>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#cristal" 
                          position="0 0 0" 
                          scale="0.25 0.25 0.25" 
                          rotation="0 0 0"
                          swipe-rotate>
            </a-gltf-model>
        </a-entity>

    </a-scene>

</body>
</html>
